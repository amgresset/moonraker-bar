# Builds Moonraker Bar for macOS (universal), Linux and Windows, signs the
# updater artifacts, and publishes a draft GitHub Release with latest.json.
#
# Trigger: push a tag like v0.2.0 (the version must match package.json,
# src-tauri/Cargo.toml and src-tauri/tauri.conf.json), or run it by hand.
#
# Required repository secrets:
#   TAURI_SIGNING_PRIVATE_KEY           contents of ~/.tauri/moonraker-bar.key
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD  its password
#
# Optional, for signed + notarized macOS builds (uncomment the env block below):
#   APPLE_CERTIFICATE, APPLE_CERTIFICATE_PASSWORD, APPLE_SIGNING_IDENTITY,
#   APPLE_ID, APPLE_PASSWORD, APPLE_TEAM_ID

name: Release

on:
    push:
        tags: ["v*"]
    workflow_dispatch:

permissions:
    contents: write

jobs:
    build:
        strategy:
            fail-fast: false
            matrix:
                include:
                    - platform: macos-latest
                      args: --target universal-apple-darwin
                    - platform: ubuntu-22.04
                      args: ""
                    - platform: windows-latest
                      args: ""
        runs-on: ${{ matrix.platform }}

        steps:
            - uses: actions/checkout@v4

            - name: Linux dependencies
              if: matrix.platform == 'ubuntu-22.04'
              run: |
                  sudo apt-get update
                  sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm

            - uses: dtolnay/rust-toolchain@stable
              with:
                  targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

            - uses: swatinem/rust-cache@v2
              with:
                  workspaces: src-tauri -> target

            - run: npm ci

            - uses: tauri-apps/tauri-action@v0
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
                  TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
                  # APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
                  # APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
                  # APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
                  # APPLE_ID: ${{ secrets.APPLE_ID }}
                  # APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
                  # APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
              with:
                  tagName: v__VERSION__
                  releaseName: Moonraker Bar v__VERSION__
                  releaseBody: See the assets below to download and install this version.
                  releaseDraft: true
                  prerelease: false
                  includeUpdaterJson: true
                  args: ${{ matrix.args }}
